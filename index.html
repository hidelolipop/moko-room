<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>モコちゃんの箱庭</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #2b1e16;
      color: #4a3525;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 14px 16px 20px;
      overflow-x: hidden;
    }
    /* 日付・時間・天気・気温のステータスバー */
    .status-bar {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 248, 240, 0.14);
      border: 1px solid rgba(255, 248, 240, 0.25);
      border-radius: 16px;
      padding: 8px 14px;
      color: #fff8f0;
      font-size: 12.5px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px 10px;
      backdrop-filter: blur(4px);
    }
    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-time {
      font-weight: bold;
      letter-spacing: 0.03em;
    }
    .status-weather {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    /* 箱庭の表示エリア */
    .room-frame {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background-color: #d6c8b8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .room-stage {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: 50% 66%;
    }
    .room-stage.zoomed {
      transform: scale(1.75);
    }
    .room-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    #img-night {
      opacity: 0;
    }
    /* 天気エフェクトレイヤー（雪・雨） */
    .weather-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      top: -12px;
      pointer-events: none;
    }
    .particle.snow {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
      animation: fallSnow linear forwards;
    }
    .particle.rain {
      width: 2px;
      height: 12px;
      background: rgba(190, 220, 255, 0.65);
      border-radius: 2px;
      transform: rotate(12deg);
      animation: fallRain linear forwards;
    }
    @keyframes fallSnow {
      0% { transform: translate(0, -10px); opacity: 0.9; }
      100% { transform: translate(18px, 430px); opacity: 0.2; }
    }
    @keyframes fallRain {
      0% { transform: translate(0, -14px) rotate(12deg); opacity: 0.8; }
      100% { transform: translate(35px, 430px) rotate(12deg); opacity: 0.2; }
    }
    /* モコちゃんの配置（ラグの中央・少し大きめ・足元接地） */
    .moko-wrapper {
      position: absolute;
      left: 50%;
      top: 66%;
      width: 30%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 5;
      transition: filter 0.8s ease;
    }
    /* ラグに落ちる接地影 */
    .moko-wrapper::after {
      content: "";
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 14%;
      background: radial-gradient(ellipse at center, rgba(45, 25, 10, 0.45) 0%, rgba(45, 25, 10, 0) 72%);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }
    .moko-img {
      width: 100%;
      height: auto;
      display: block;
      transform-origin: bottom center;
      animation: breathe 3.4s ease-in-out infinite;
    }
    /* 夜モード時は暖色ライトに馴染ませる */
    .night-mode .moko-wrapper {
      filter: brightness(0.88) sepia(0.18);
    }
    /* なでなで反応アニメーション */
    .moko-wrapper.happy .moko-img {
      animation: happyJump 0.55s ease;
    }
    /* 足元は動かさず体だけふんわり呼吸 */
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.015, 0.988); }
    }
    @keyframes happyJump {
      0% { transform: scale(1, 1) translateY(0); }
      30% { transform: scale(1.07, 0.93) translateY(0); }
      60% { transform: scale(0.96, 1.06) translateY(-8px) rotate(-2deg); }
      80% { transform: scale(1.02, 0.98) translateY(0) rotate(1.5deg); }
      100% { transform: scale(1, 1) translateY(0) rotate(0); }
    }
    /* ハートエフェクト */
    .heart {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      pointer-events: none;
      animation: floatHeart 1s ease-out forwards;
    }
    @keyframes floatHeart {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.7); }
      100% { opacity: 0; transform: translate(-50%, -32px) scale(1.2); }
    }
    /* 画像下のマークボタンバー */
    .action-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 248, 240, 0.16);
      color: #f5ebe0;
      border: 1px solid rgba(255, 248, 240, 0.3);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .icon-btn:active {
      transform: scale(0.94);
    }
    /* 下部の吹き出しUI */
    .dialog-box {
      width: 100%;
      max-width: 420px;
      background-color: #fff9f2;
      border: 3px solid #e6c5a8;
      border-radius: 22px;
      padding: 20px 18px 16px;
      margin-top: 8px;
      position: relative;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }
    .name-tag {
      position: absolute;
      top: -15px;
      left: 20px;
      background-color: #b85d3b;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 16px;
      border-radius: 14px;
    }
    .message {
      font-size: 15px;
      line-height: 1.6;
      min-height: 48px;
    }
    .hint {
      text-align: right;
      font-size: 11px;
      color: #a88b76;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-group">
      <span id="date-display">----/--/-- (-)</span>
      <span class="status-time" id="time-display">--:--</span>
    </div>
    <div class="status-weather">
      <span id="weather-icon">🌤️</span>
      <span id="weather-text">天気取得中...</span>
      <span id="temp-display">--℃</span>
    </div>
  </div>

  <div class="room-frame">
    <div class="room-stage" id="room-stage">
      <img src="room_day.jpg" alt="昼の部屋" class="room-img" id="img-day">
      <img src="room_night.jpg" alt="夜の部屋" class="room-img" id="img-night">
      <div class="weather-overlay" id="weather-overlay"></div>

      <div class="moko-wrapper" id="moko" onclick="petMoko()">
        <img src="moko_christmas.png" alt="モコちゃん" class="moko-img" id="moko-img">
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="icon-btn"
