<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>モコちゃんの箱庭</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #2b1e16;
      color: #4a3525;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 14px 16px 20px;
      overflow-x: hidden;
    }
    /* 日付・時間・天気・気温のステータスバー */
    .status-bar {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 248, 240, 0.14);
      border: 1px solid rgba(255, 248, 240, 0.25);
      border-radius: 16px;
      padding: 8px 14px;
      color: #fff8f0;
      font-size: 12.5px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px 10px;
      backdrop-filter: blur(4px);
    }
    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-time {
      font-weight: bold;
      letter-spacing: 0.03em;
    }
    .status-weather {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    /* 箱庭の表示エリア */
    .room-frame {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background-color: #d6c8b8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .room-stage {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: 50% 66%;
    }
    .room-stage.zoomed {
      transform: scale(1.75);
    }
    .room-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    #img-night {
      opacity: 0;
    }
    /* 天気エフェクトレイヤー（雪・雨） */
    .weather-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      top: -12px;
      pointer-events: none;
    }
    .particle.snow {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
      animation: fallSnow linear forwards;
    }
    .particle.rain {
      width: 2px;
      height: 12px;
      background: rgba(190, 220, 255, 0.65);
      border-radius: 2px;
      transform: rotate(12deg);
      animation: fallRain linear forwards;
    }
    @keyframes fallSnow {
      0% { transform: translate(0, -10px); opacity: 0.9; }
      100% { transform: translate(18px, 430px); opacity: 0.2; }
    }
    @keyframes fallRain {
      0% { transform: translate(0, -14px) rotate(12deg); opacity: 0.8; }
      100% { transform: translate(35px, 430px) rotate(12deg); opacity: 0.2; }
    }
    /* モコちゃんの配置（ラグの中央・少し大きめ・足元接地） */
    .moko-wrapper {
      position: absolute;
      left: 50%;
      top: 66%;
      width: 30%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 5;
      transition: filter 0.8s ease;
    }
    /* ラグに落ちる接地影 */
    .moko-wrapper::after {
      content: "";
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 14%;
      background: radial-gradient(ellipse at center, rgba(45, 25, 10, 0.45) 0%, rgba(45, 25, 10, 0) 72%);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }
    .moko-img {
      width: 100%;
      height: auto;
      display: block;
      transform-origin: bottom center;
    }
    /* 夜モード時は暖色ライトに馴染ませる */
    .night-mode .moko-wrapper {
      filter: brightness(0.88) sepia(0.18);
    }
    /* なでなで反応アニメーション（タップ時のみ） */
    .moko-wrapper.happy .moko-img {
      animation: happyJump 0.55s ease;
    }
    @keyframes happyJump {
      0% { transform: scale(1, 1) translateY(0); }
      30% { transform: scale(1.07, 0.93) translateY(0); }
      60% { transform: scale(0.96, 1.06) translateY(-8px) rotate(-2deg); }
      80% { transform: scale(1.02, 0.98) translateY(0) rotate(1.5deg); }
      100% { transform: scale(1, 1) translateY(0) rotate(0); }
    }
    /* ハートエフェクト */
    .heart {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      pointer-events: none;
      animation: floatHeart 1s ease-out forwards;
    }
    @keyframes floatHeart {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.7); }
      100% { opacity: 0; transform: translate(-50%, -32px) scale(1.2); }
    }
    /* 画像下のマークボタンバー */
    .action-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 248, 240, 0.16);
      color: #f5ebe0;
      border: 1px solid rgba(255, 248, 240, 0.3);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .icon-btn:active {
      transform: scale(0.94);
    }
    /* 下部の吹き出しUI */
    .dialog-box {
      width: 100%;
      max-width: 420px;
      background-color: #fff9f2;
      border: 3px solid #e6c5a8;
      border-radius: 22px;
      padding: 20px 18px 16px;
      margin-top: 8px;
      position: relative;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }
    .name-tag {
      position: absolute;
      top: -15px;
      left: 20px;
      background-color: #b85d3b;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 16px;
      border-radius: 14px;
    }
    .message {
      font-size: 15px;
      line-height: 1.6;
      min-height: 48px;
    }
    .hint {
      text-align: right;
      font-size: 11px;
      color: #a88b76;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-group">
      <span id="date-display">----/--/-- (-)</span>
      <span class="status-time" id="time-display">--:--</span>
    </div>
    <div class="status-weather">
      <span id="weather-icon">🌤️</span>
      <span id="weather-text">天気取得中...</span>
      <span id="temp-display">--℃</span>
    </div>
  </div>

  <div class="room-frame">
    <div class="room-stage" id="room-stage">
      <img src="room_day.jpg" alt="昼の部屋" class="room-img" id="img-day">
      <img src="room_night.jpg" alt="夜の部屋" class="room-img" id="img-night">
      <div class="weather-overlay" id="weather-overlay"></div>

      <div class="moko-wrapper" id="moko" onclick="petMoko()">
        <img src="moko_christmas.png" alt="モコちゃん" class="moko-img" id="moko-img">
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="icon-btn" id="time-btn" onclick="toggleTime()" aria-label="昼夜切り替え">🌙</button>
    <button class="icon-btn" id="zoom-btn" onclick="toggleZoom()" aria-label="ズーム切り替え">🔍</button>
  </div>

  <div class="dialog-box" onclick="nextMessage()">
    <div class="name-tag">モコ</div>
    <div class="message" id="message-text">じゃーん！サンタ帽子とチェックのマフラーにお着替えしたよ🎄✨<br>似合ってるかな？🐑💕</div>
    <div class="hint">▼ タップでおしゃべり / モコちゃんなでなで</div>
  </div>

  <script>
    let isNight = false;
    let isZoomed = false;
    let msgIndex = 0;
    let currentWeatherType = "clear";
    let currentWeatherLabel = "穏やか";
    let currentTemp = null;
    let particleTimer = null;

    const LAT = 35.6664;
    const LON = 139.3144;

    let messages = [
      "じゃーん！サンタ帽子とチェックのマフラーにお着替えしたよ🎄✨<br>似合ってるかな？🐑💕",
      "冬のお部屋は暖炉の火がとっても暖かくて大好き〜🔥",
      "ぼくのこと、タップしてなでなでしてみてね🐑💖"
    ];

    const petMessages = [
      "めぇ〜💕 サンタ帽、褒めてくれて嬉しいなっ！",
      "えへへ、マフラーあったかいよ〜🧣✨",
      "クリスマスが待ちきれないね〜🎄🎁",
      "なでなで大好きっ！もふもふでしょ〜？🐑💖"
    ];

    function applyNightState(night) {
      isNight = night;
      document.getElementById('img-night').style.opacity = isNight ? '1' : '0';
      document.getElementById('room-stage').classList.toggle('night-mode', isNight);
      document.getElementById('time-btn').textContent = isNight ? '☀️' : '🌙';
    }

    function syncTimeOfDay(now) {
      const hour = now.getHours();
      const shouldBeNight = (hour >= 18 || hour < 6);
      if (shouldBeNight !== isNight) {
        applyNightState(shouldBeNight);
      }
    }

    function updateClock() {
      const now = new Date();
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekday = weekdays[now.getDay()];

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      document.getElementById("date-display").textContent = `${year}/${month}/${day} (${weekday})`;
      document.getElementById("time-display").textContent = `${hours}:${minutes}`;

      syncTimeOfDay(now);
    }

    function getWeatherInfo(code) {
      if (code === 0) return { icon: "☀️", label: "晴れ", type: "clear" };
      if (code === 1 || code === 2) return { icon: "🌤️", label: "晴れ時々くもり", type: "cloudy" };
      if (code === 3) return { icon: "☁️", label: "くもり", type: "cloudy" };
      if (code === 45 || code === 48) return { icon: "🌫️", label: "霧", type: "cloudy" };
      if ([51, 53, 55, 56, 57].includes(code)) return { icon: "🌦️", label: "霧雨", type: "rain" };
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { icon: "🌧️", label: "雨", type: "rain" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: "❄️", label: "雪", type: "snow" };
      if ([95, 96, 99].includes(code)) return { icon: "⛈️", label: "雷雨", type: "rain" };
      return { icon: "🌡️", label: "穏やか", type: "clear" };
    }

    function startWeatherParticles(type) {
      if (particleTimer) {
        clearInterval(particleTimer);
        particleTimer = null;
      }
      const overlay = document.getElementById("weather-overlay");
      overlay.innerHTML = "";

      if (type !== "snow" && type !== "rain") return;

      const intervalMs = type === "rain" ? 140 : 320;
      particleTimer = setInterval(() => {
        const p = document.createElement("div");
        p.className = `particle ${type}`;
        p.style.left = `${Math.random() * 100}%`;
        const duration = type === "rain" ? (0.7 + Math.random() * 0.4) : (3.5 + Math.random() * 2.5);
        p.style.animationDuration = `${duration}s`;
        if (type === "snow") {
          const size = 4 + Math.random() * 4;
          p.style.width = `${size}px`;
          p.style.height = `${size}px`;
        }
        overlay.appendChild(p);
        setTimeout(() => p.remove(), duration * 1000 + 200);
      }, intervalMs);
    }

    function rebuildWeatherMessages() {
      const hour = new Date().getHours();
      let timeGreeting = "こんにちは！今日もゆっくり過ごそうね🐑✨";
      if (hour >= 5 && hour < 11) {
        timeGreeting = "おはよう〜！朝のお部屋も気持ちいいね☀️🐑";
      } else if (hour >= 11 && hour < 17) {
        timeGreeting = "こんにちは！お昼の箱庭でのんびり中だよ🌤️💕";
      } else if (hour >= 17 && hour < 20) {
        timeGreeting = "だんだん暗くなってきたね🌇 ランプがぽかぽかだよ〜✨";
      } else {
        timeGreeting = "もう夜だね🌙 暖炉があたたかくて眠くなっちゃうかも…🐑💤";
      }

      let weatherLine = "";
      if (currentWeatherType === "snow") {
        weatherLine = `外は「${currentWeatherLabel}」みたい❄️ サンタ帽もマフラーも大活躍だね！`;
      } else if (currentWeatherType === "rain") {
        weatherLine = `外は「${currentWeatherLabel}」みたい☔ お部屋の中でぬくぬくしようね〜🏠💕`;
      } else if (currentWeatherType === "cloudy") {
        weatherLine = `今の天気は「${currentWeatherLabel}」だよ☁️ お部屋はいつでもぽかぽか〜🔥`;
      } else {
        weatherLine = `今の天気は「${currentWeatherLabel}」みたい☀️ おさんぽ日和かな？🐑`;
      }

      let tempLine = "";
      if (typeof currentTemp === "number") {
        if (currentTemp <= 10) {
          tempLine = `気温は ${currentTemp}℃ だって！冷えるからマフラーしっかり巻いてね🧣❄️`;
        } else if (currentTemp >= 24) {
          tempLine = `気温は ${currentTemp}℃ だって！ちょっとぽかぽか陽気だね〜🌸`;
        } else {
          tempLine = `気温は ${currentTemp}℃ だよ🌡️ ちょうどいい感じだね〜😊`;
        }
      }

      messages = [
        timeGreeting,
        weatherLine,
        tempLine || "じゃーん！サンタ帽子とチェックのマフラーにお着替えしたよ🎄✨",
        "ぼくのこと、タップしてなでなでしてみてね🐑💖"
      ].filter(Boolean);

      msgIndex = 0;
      document.getElementById('message-text').innerHTML = messages[0];
    }

    async function updateWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Weather fetch failed");
        const data = await res.json();
        const current = data.current;

        const info = getWeatherInfo(current.weather_code);
        const temp = Math.round(current.temperature_2m);

        currentWeatherType = info.type;
        currentWeatherLabel = info.label;
        currentTemp = temp;

        document.getElementById("weather-icon").textContent = info.icon;
        document.getElementById("weather-text").textContent = info.label;
        document.getElementById("temp-display").textContent = `${temp}℃`;

        startWeatherParticles(info.type);
        rebuildWeatherMessages();
      } catch (e) {
        document.getElementById("weather-icon").textContent = "🌤️";
        document.getElementById("weather-text").textContent = "取得できず";
        document.getElementById("temp-display").textContent = "--℃";
        rebuildWeatherMessages();
      }
    }

    function toggleTime() {
      applyNightState(!isNight);
    }

    function toggleZoom() {
      isZoomed = !isZoomed;
      const stage = document.getElementById('room-stage');
      stage.classList.toggle('zoomed', isZoomed);
      document.getElementById('zoom-btn').textContent = isZoomed ? '🏠' : '🔍';
    }

    function nextMessage() {
      msgIndex = (msgIndex + 1) % messages.length;
      document.getElementById('message-text').innerHTML = messages[msgIndex];
    }

    function petMoko() {
      const moko = document.getElementById('moko');
      moko.classList.remove('happy');
      void moko.offsetWidth;
      moko.classList.add('happy');

      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '💕';
      moko.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);

      const randomPetMsg = petMessages[Math.floor(Math.random() * petMessages.length)];
      document.getElementById('message-text').innerHTML = randomPetMsg;
    }

    updateClock();
    rebuildWeatherMessages();
    updateWeather();
    setInterval(updateClock, 1000);
    setInterval(updateWeather, 30 * 60 * 1000);
  </script>
</body>
</html>
